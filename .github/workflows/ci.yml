name: CI

on:
  push:
    branches: [master]
  pull_request:

# Nothing here writes to the repo.
permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 is the current LTS. Note that vitest rejects odd-numbered
          # (non-LTS) releases, so this cannot simply track "latest".
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
